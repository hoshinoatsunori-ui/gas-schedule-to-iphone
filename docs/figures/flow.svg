<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" font-family="Noto Sans CJK JP, IPAGothic, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="430" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- lanes -->
  <rect x="20" y="40" width="560" height="350" fill="#f5f7fa" stroke="#c8ced6"/>
  <text x="36" y="68" font-size="18" font-weight="700" fill="#333">Google Workspace（予定の元データ）</text>
  <rect x="620" y="40" width="560" height="350" fill="#f7f7f2" stroke="#cfcfc4"/>
  <text x="636" y="68" font-size="18" font-weight="700" fill="#333">iPhone（登録先）</text>

  <!-- boxes left -->
  <g font-size="16" fill="#222">
    <rect x="50" y="100" width="220" height="80" rx="6" fill="#fff" stroke="#555"/>
    <text x="160" y="135" text-anchor="middle" font-weight="700">Googleカレンダー</text>
    <text x="160" y="160" text-anchor="middle" font-size="13" fill="#555">今週（月〜日）の予定</text>

    <rect x="330" y="100" width="220" height="80" rx="6" fill="#fff" stroke="#555"/>
    <text x="440" y="130" text-anchor="middle" font-weight="700">GAS</text>
    <text x="440" y="152" text-anchor="middle" font-size="13" fill="#555">毎週月曜・時間主導トリガー</text>
    <text x="440" y="170" text-anchor="middle" font-size="13" fill="#555">予定 → JSON → トークン化</text>

    <rect x="330" y="250" width="220" height="100" rx="6" fill="#fff" stroke="#555"/>
    <text x="440" y="280" text-anchor="middle" font-weight="700">メール（Gmail）</text>
    <text x="440" y="304" text-anchor="middle" font-size="13" fill="#555">予定一覧＋登録ボタン</text>
    <text x="440" y="326" text-anchor="middle" font-size="12" fill="#555" font-family="monospace">https://example.com/#WKSCHED…</text>
  </g>

  <!-- boxes right -->
  <g font-size="16" fill="#222">
    <rect x="650" y="250" width="220" height="100" rx="6" fill="#fff" stroke="#555"/>
    <text x="760" y="280" text-anchor="middle" font-weight="700">ボタンを長押し</text>
    <text x="760" y="304" text-anchor="middle" font-size="13" fill="#555">「共有…」→「予定追加」</text>
    <text x="760" y="326" text-anchor="middle" font-size="13" fill="#555">（またはリンクをコピー）</text>

    <rect x="930" y="250" width="220" height="100" rx="6" fill="#fff" stroke="#555"/>
    <text x="1040" y="276" text-anchor="middle" font-weight="700">ショートカット</text>
    <text x="1040" y="298" text-anchor="middle" font-size="13" fill="#555">トークン抽出 → Base64復元</text>
    <text x="1040" y="318" text-anchor="middle" font-size="13" fill="#555">→ 辞書化 → 一覧から選択</text>
    <text x="1040" y="338" text-anchor="middle" font-size="13" fill="#555">→ 繰り返して登録</text>

    <rect x="930" y="100" width="220" height="80" rx="6" fill="#fff" stroke="#555"/>
    <text x="1040" y="135" text-anchor="middle" font-weight="700">iPhoneのカレンダー</text>
    <text x="1040" y="160" text-anchor="middle" font-size="13" fill="#555">選んだ予定だけを登録</text>
  </g>

  <!-- arrows -->
  <g stroke="#333" stroke-width="2" fill="none" marker-end="url(#ar)">
    <line x1="270" y1="140" x2="328" y2="140"/>
    <line x1="440" y1="180" x2="440" y2="248"/>
    <line x1="550" y1="300" x2="648" y2="300"/>
    <line x1="870" y1="300" x2="928" y2="300"/>
    <line x1="1040" y1="250" x2="1040" y2="182"/>
  </g>
  <rect x="512" y="226" width="176" height="22" fill="#ffffff"/>
  <line x1="600" y1="250" x2="600" y2="294" stroke="#b03a2e" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="600" y="242" text-anchor="middle" font-size="13" fill="#b03a2e" font-weight="700">メールだけが境界を越える</text>

  <text x="600" y="414" text-anchor="middle" font-size="12" fill="#777">サーバー・Webアプリ公開・添付ファイルは使わない（データはURLの # 以降に入れ、サーバーには送られない）</text>
</svg>
